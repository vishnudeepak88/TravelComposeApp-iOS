# Build + test the Voygo iOS app and backend on every push/PR to main.
#
# iOS: xcodebuild build-for-testing followed by test-without-building
# pinned to a concrete simulator so we never block on CI runner-side
# device selection. Coverage is enabled to keep the trend line visible
# even when individual tests skip.
#
# Backend: a separate Node job runs `npm test` (node --test) against
# the suites under `backend/test/`.

name: iOS + Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ios:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for testing
        # `IPHONEOS_DEPLOYMENT_TARGET=18.0` overrides the project's iOS
        # 26 setting just for CI — the GitHub macos-15 runner ships
        # Xcode 16.x (max iOS 18.5 SDK), so 26 is rejected with
        # "supported deployment target versions is 12.0 to 18.5.99".
        # Local builds still use 26.0 from the pbxproj.
        run: |
          set -o pipefail
          xcodebuild \
            -project TravelComposeApp.xcodeproj \
            -scheme TravelComposeApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            build-for-testing

      - name: Test
        # `test-without-building` reuses the products from build-for-testing
        # so any compile failure surfaces in the build step, and the test
        # step shows a clean pass/fail summary.
        run: |
          set -o pipefail
          xcodebuild \
            -project TravelComposeApp.xcodeproj \
            -scheme TravelComposeApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            test-without-building

  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Run backend tests
        working-directory: backend
        run: npm test
