# Build the Voygo iOS app on every push/PR to main.
#
# Uses xcodebuild because this is an Xcode project (no Package.swift).
# Build-only for now — there's no test target wired into the project yet.
# When tests land, add a `test` step with `-destination` pointing at a
# concrete simulator (e.g. iPhone 15) and `-enableCodeCoverage YES`.

name: iOS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        # `IPHONEOS_DEPLOYMENT_TARGET=18.0` overrides the project's iOS
        # 26 setting just for CI — the GitHub macos-15 runner ships
        # Xcode 16.x (max iOS 18.5 SDK), so 26 is rejected with
        # "supported deployment target versions is 12.0 to 18.5.99".
        # Local builds still use 26.0 from the pbxproj.
        run: |
          set -o pipefail
          xcodebuild \
            -project TravelComposeApp.xcodeproj \
            -scheme TravelComposeApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            build
