services:
  - type: web
    name: voygo-ios-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: voygo-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      # `staging` boots with full security hardening (real JWT secret,
      # no dev OTP echo, no devCode in /auth/request-otp responses) but
      # allows Billplz mock-charges and local-disk KYC uploads while
      # those services are being wired up. Flip to `production` once
      # BILLPLZ_API_KEY / BILLPLZ_COLLECTION_ID / BILLPLZ_X_SIGNATURE_KEY
      # and KYC_S3_BUCKET are set in the Render dashboard.
      - key: NODE_ENV
        value: staging
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: NOMINATIM_BASE_URL
        value: https://nominatim.openstreetmap.org

databases:
  - name: voygo-postgres
    databaseName: voygo
    user: voygo
    plan: free
    ipAllowList: []
